name: Release

# Push a tag like v0.1.0 to build the Windows installer + portable exe and
# attach them to a GitHub Release automatically.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build + package + publish to GitHub Release
        run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One-line installer for machines without the app yet (or still on the old .bat launcher):
      #   irm https://github.com/pendragonzzz/rotmg-companion/releases/latest/download/install.ps1 | iex
      - name: Attach install.ps1
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" scripts/install.ps1 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
