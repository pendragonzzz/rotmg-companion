name: Release

# Builds the Windows installer + portable exe and publishes them as a GitHub Release
# (installed copies auto-update to it). Two ways in:
#   - push a tag like v0.2.0, or
#   - "Run workflow" (Actions tab / API) on a branch: tags that commit as v<package.json version>.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve the release tag
        id: tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tag="${GITHUB_REF_NAME}"
          else tag="v$(node -p "require('./package.json').version")"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag} from ${GITHUB_SHA}"

      # Manual runs tag the commit themselves. (A tag pushed with GITHUB_TOKEN doesn't
      # re-trigger this workflow, so the build below is the only one.)
      - name: Tag this commit
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          tag='${{ steps.tag.outputs.tag }}'
          if git ls-remote --exit-code origin "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} already exists — bump the version in package.json first."
            exit 1
          fi
          git tag "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}"

      - run: npm ci

      - name: Build + package + publish to GitHub Release
        run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One-line installer for machines without the app yet (or still on the old .bat launcher):
      #   irm https://github.com/pendragonzzz/rotmg-companion/releases/latest/download/install.ps1 | iex
      - name: Attach install.ps1
        shell: bash
        run: gh release upload '${{ steps.tag.outputs.tag }}' scripts/install.ps1 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
